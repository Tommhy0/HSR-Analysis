<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>崩铁伤害计算器（常规环境）</title>
<!--
  这个模板是两个成品的**唯一源文件**：
    开发期   hsr_server.mjs 把底部的 DATA 占位符换成加载 _data_cache/data.inline.js 的 script 标签，
                            把 BOOT 占位符换成加载 ui/app.mjs 的 module 标签
    成品     打包单文件.bat  把两者换成 gzip+base64 的内嵌数据、以及拼好的模块包
  开发与成品于是只差「数据怎么塞进去」这一件事，界面代码一个字节都不改。
  页面**从不 fetch** —— 所以 file:// 下的 CORS 问题从根上不存在。

  ⚠ 这段注释**不许出现占位符、脚本标签的字面量**。这里踩过两次：
    ① 注释里写了占位符，String.replace 只换第一处，于是替换发生在注释里，
       真正的占位符原样留在页面上，页面白屏且什么都不报；
    ② 注释里写了 script 标签，之后任何 grep 都会多数出一份。
    现在注入方会断言「占位符恰好出现一次」，再犯会当场报错。
-->
<style>
/*__CSS__*/
</style>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="#" aria-label="崩铁伤害计算器"><span class="brand-mark">✦</span><span>星穹演算<small>ASTRAL WORKBENCH</small></span></a>
    <div class="nav-caption">计算工作台</div>
    <nav id="side-nav" aria-label="工作区">
      <button id="nav-setup" class="nav-item active"><span class="nav-icon">◈</span>角色与输出<span class="nav-index">01</span></button>
      <button id="nav-relics" class="nav-item"><span class="nav-icon">◇</span>遗器配装<span class="nav-index">02</span></button>
      <button id="nav-buffs" class="nav-item"><span class="nav-icon">⌘</span>增益管理<span class="nav-index">03</span></button>
      <button id="nav-battle" class="nav-item"><span class="nav-icon">◎</span>战斗情境<span class="nav-index">04</span></button>
      <button id="nav-data" class="nav-item"><span class="nav-icon">▤</span>数据与来源<span class="nav-index">05</span></button>
    </nav>
    <div class="mode-switch"><a class="mode-link active" href="./崩铁伤害计算器.html">单次伤害计算</a><a class="mode-link" href="./战斗模拟器.html">四人自动战斗 →</a></div>
    <div class="sidebar-selection"><div class="nav-caption">当前计算</div><strong id="shell-character">载入中</strong><span id="shell-ability"></span><div class="sidebar-divider"></div><span id="shell-selected"></span></div>
    <div class="sidebar-footer"><span class="live-dot"></span> 本地计算 · 离线可用<small>常规环境 / 单次技能伤害</small></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div class="breadcrumb">工作台 <span>/</span> <b id="shell-view-label">角色与输出</b></div><div class="topbar-tools"><label class="theme-choice"><span>界面</span><select id="f-theme" aria-label="界面主题"><option value="dark">深色专业</option><option value="light">清爽浅色</option></select></label><span class="build-tag" id="shell-version">载入数据</span><span class="local-tag">LOCAL</span></div></header>
    <div class="workspace-heading"><div><div class="eyebrow">DAMAGE ANALYSIS</div><h1 id="shell-heading">定义你的下一击。</h1><p id="shell-description">选定角色与技能，录入局外面板，查看每一个伤害乘区。</p></div><button class="primary" id="calc"><span>计算伤害</span><kbd>↵</kbd></button></div>
    <div class="banner" id="banner"><div id="banner-chips"></div></div>
    <main class="workspace-grid">
      <section id="left" aria-label="计算输入">
        <div class="workspace-group" id="view-setup"><div class="setup-top"><div class="card" id="sec-actor"></div><div class="card" id="sec-ability"></div></div><div class="card" id="sec-panel"></div></div>
        <div class="workspace-group" id="view-relics" hidden><div class="card" id="sec-relics"></div></div>
        <div class="workspace-group" id="view-buffs" hidden><div class="card" id="sec-globals"></div><div class="card" id="sec-self"></div><div class="card" id="sec-team"></div></div>
        <div class="workspace-group" id="view-battle" hidden><div class="card" id="sec-scenario"></div><div class="card" id="sec-scene-effects"></div><div class="card" id="sec-metrics"></div></div>
        <div class="workspace-group" id="view-data" hidden><div class="card" id="sec-data"></div></div>
      </section>
      <aside id="right" aria-label="伤害结果"><div class="card result-card" id="result"></div></aside>
    </main>
    <footer class="workspace-footer"><span>崩铁伤害计算器</span><span>面板 → 增益 → 敌人 → 伤害</span></footer>
  </div>
</div>

</html>
